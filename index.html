<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Controle de Entregas</title>
<meta name="theme-color" content="#059669" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Entregas" />
<style>
  :root{
    --bg:#f5f5f4; --card:#fff; --ink:#1c1917; --muted:#a8a29e; --muted2:#78716c;
    --em:#059669; --em7:#047857; --em50:#ecfdf5; --em100:#d1fae5;
    --rd:#dc2626; --rd7:#b91c1c; --rd50:#fef2f2; --rd100:#fee2e2;
    --stone100:#f5f5f4; --stone200:#e7e5e4; --stone300:#d6d3d1;
  }
  :root{color-scheme:light;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  html{background:var(--bg);-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  #app{
    height:100%; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; padding-top:env(safe-area-inset-top);
  }
  .wrap{max-width:448px;margin:0 auto;padding:0 16px 132px;}
  .tnum{font-variant-numeric:tabular-nums;}
  .cap{text-transform:capitalize;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  button:focus-visible{outline:3px solid #a8a29e;outline-offset:2px;}
  [hidden]{display:none!important;}

  /* topo: alternador Dia/Mês + ajustes */
  .toggle-row{padding:24px 0 16px;display:flex;justify-content:space-between;align-items:center;}
  .spacer{width:40px;flex-shrink:0;}
  .toggle{background:#fff;border-radius:999px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:inline-flex;}
  .toggle button{padding:8px 18px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted2);transition:.15s;}
  .toggle button.on{background:#1c1917;color:#fff;}
  .gear{width:40px;height:40px;flex-shrink:0;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);
    display:flex;align-items:center;justify-content:center;color:var(--muted2);transition:.12s;}
  .gear:active{transform:scale(.94);}

  /* header nav */
  .nav{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;}
  .nav .arrow{width:44px;height:44px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);
    display:flex;align-items:center;justify-content:center;color:var(--muted2);transition:.12s;}
  .nav .arrow:active{transform:scale(.94);}
  .nav .arrow:disabled{opacity:.3;}
  .nav .title{font-size:20px;font-weight:800;line-height:1.1;text-align:center;margin:0;}
  .nav .sub{font-size:14px;color:var(--muted);margin:0;text-align:center;}

  /* card saldo */
  .card{background:#fff;border-radius:24px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:24px;margin-bottom:16px;}
  .card .lbl{font-size:14px;font-weight:500;color:var(--muted);margin:0 0 4px;}
  .card .big{font-size:44px;font-weight:800;letter-spacing:-1px;margin:0;line-height:1.05;}
  .pos{color:var(--em);} .neg{color:var(--rd);} .zero{color:#292524;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
  .mini{border-radius:16px;padding:12px;}
  .mini.g{background:var(--em50);} .mini.r{background:var(--rd50);}
  .mini .cap-lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin:0 0 2px;}
  .mini.g .cap-lbl{color:rgba(4,120,87,.7);} .mini.r .cap-lbl{color:rgba(185,28,28,.7);}
  .mini .val{font-size:20px;font-weight:700;margin:0;}
  .mini.g .val{color:var(--em7);} .mini.r .val{color:var(--rd7);}
  .media{font-size:12px;color:var(--muted);margin:16px 0 0;}

  /* meta do dia */
  .meta{margin-top:20px;padding-top:16px;border-top:1px solid var(--stone200);}
  .metatop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    font-size:13px;font-weight:600;color:var(--muted2);margin-bottom:8px;}
  .bar{height:8px;background:var(--stone200);border-radius:999px;overflow:hidden;}
  .bar>i{display:block;height:100%;background:var(--em);border-radius:999px;transition:width .3s;}
  .bar>i.r{background:var(--rd);}   /* barras de gasto: vermelho, como toda saída no app */
  .metasub{font-size:12px;color:var(--muted);margin:8px 0 0;}
  .metasub.ok{color:var(--em7);font-weight:600;}

  /* resumo por origem / categoria */
  .brk{display:flex;flex-direction:column;gap:12px;margin-top:14px;}
  .bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin-bottom:6px;}
  .bname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bval{color:var(--muted2);font-size:13px;flex-shrink:0;}

  /* gráfico de gastos por dia (abas Semana e Mês) */
  .gchips{display:flex;gap:8px;overflow-x:auto;margin:12px -24px 0;padding:0 24px 2px;scrollbar-width:none;}
  .gchips::-webkit-scrollbar{display:none;}
  .gchip{flex-shrink:0;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--stone100);color:var(--muted2);transition:.12s;}
  .gchip.on{background:#1c1917;color:#fff;}
  .gtotal{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:16px 0 0;line-height:1.1;}
  .gleitura{font-size:13px;color:var(--muted2);margin:4px 0 14px;min-height:18px;}
  .gleitura b{color:var(--ink);font-weight:700;}
  .grafico{display:block;width:100%;height:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:pointer;outline:none;}
  .grafico:focus-visible{outline:3px solid #a8a29e;outline-offset:4px;border-radius:8px;}
  .grafico text{font-family:inherit;font-variant-numeric:tabular-nums;}
  .gvazio{font-size:14px;color:var(--muted);margin:12px 0 0;}

  /* lista */
  .empty{text-align:center;padding:56px 24px;}
  .empty p{margin:0;} .empty .a{color:var(--muted);font-size:18px;line-height:1.5;} .empty .b{color:var(--stone300);font-size:14px;margin-top:4px;}
  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .item{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:12px 16px;display:flex;align-items:center;gap:8px;}
  .itemmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0;text-align:left;color:inherit;transition:.12s;}
  .itemmain:active{opacity:.6;}
  .dot{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dot.g{background:var(--em100);} .dot.r{background:var(--rd100);}
  .item .mid{flex:1;min-width:0;}
  .item .desc{display:block;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .hora{display:block;font-size:12px;color:var(--muted);margin:0;}
  .item .amt{display:block;font-weight:700;flex-shrink:0;margin:0;}
  .item .amt.g{color:var(--em);} .item .amt.r{color:var(--rd);}
  .del{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--stone300);flex-shrink:0;transition:.12s;}
  .del:active{color:var(--rd);background:var(--rd50);}

  /* dia na visão mês */
  .dayrow{width:100%;background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:12px 16px;
    display:flex;align-items:center;gap:12px;text-align:left;color:inherit;transition:.12s;}
  .dayrow:active{transform:scale(.99);background:#fafaf9;}
  .daybox{width:48px;height:48px;border-radius:12px;background:var(--stone100);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
  .daybox .n{font-size:18px;font-weight:800;line-height:1;}
  .daybox .w{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;}
  .dayrow .flow{flex:1;min-width:0;}
  .dayrow .fin{display:block;font-size:14px;font-weight:600;margin:0;}
  .dayrow .fin.g{color:var(--em);} .dayrow .fin.r{color:#ef4444;}
  .dayrow .right{text-align:right;flex-shrink:0;}
  .dayrow .right .s{display:block;font-size:18px;font-weight:800;margin:0;}
  .dayrow .right .t{display:block;font-size:11px;color:var(--muted);margin:0;}

  /* barra de ação */
  .actions{position:fixed;bottom:0;left:0;right:0;padding:24px 16px calc(20px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 55%,transparent);}
  .actions .in{max-width:448px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .act{color:#fff;font-weight:700;font-size:18px;padding:16px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.12s;}
  .act:active{transform:scale(.98);}
  .act.g{background:var(--em);box-shadow:0 10px 15px -3px rgba(5,150,105,.2);}
  .act.r{background:var(--rd);box-shadow:0 10px 15px -3px rgba(220,38,38,.2);}

  /* aviso flutuante (desfazer / erro) */
  .toast{position:fixed;left:16px;right:16px;bottom:calc(108px + env(safe-area-inset-bottom));z-index:20;
    max-width:416px;margin:0 auto;background:#1c1917;color:#fff;border-radius:16px;padding:12px 8px 12px 16px;
    display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .toast.erro{background:var(--rd7);}
  .toast span{flex:1;}
  .toast button{color:#6ee7b7;font-weight:700;font-size:14px;padding:6px 10px;border-radius:10px;flex-shrink:0;}
  .toast.erro button{color:#fff;}

  /* modal */
  .overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:rgba(28,25,23,.4);}
  .sheet{background:#fff;width:100%;max-width:448px;border-radius:24px 24px 0 0;
    padding:20px 20px calc(32px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2);
    max-height:92vh;overflow-y:auto;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .sheet-head h2{font-size:20px;font-weight:800;margin:0;}
  .xbtn{width:36px;height:36px;border-radius:999px;background:var(--stone100);display:flex;align-items:center;justify-content:center;color:var(--muted2);}
  .sheet-date{font-size:14px;color:var(--muted);margin:0 0 16px;text-transform:capitalize;}
  .valbox{border-radius:16px;padding:12px 16px;margin-bottom:6px;display:flex;align-items:baseline;gap:8px;}
  .valbox.g{background:var(--em50);} .valbox.r{background:var(--rd50);} .valbox.n{background:var(--stone100);}
  .valbox .rs{font-size:24px;font-weight:700;}
  .valbox.g .rs{color:var(--em);} .valbox.r .rs{color:var(--rd);} .valbox.n .rs{color:var(--muted2);}
  .valbox input{flex:1;min-width:0;background:transparent;border:none;outline:none;font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;width:100%;}
  .valbox.g input{color:var(--em7);} .valbox.r input{color:var(--rd7);} .valbox.n input{color:var(--ink);font-size:28px;}
  .valbox input::placeholder{color:var(--stone300);}
  .valhint{font-size:13px;color:var(--muted2);margin:0 0 14px 4px;min-height:18px;font-variant-numeric:tabular-nums;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .chip{padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;background:var(--stone100);color:var(--muted2);transition:.12s;}
  .chip.on.g{background:var(--em);color:#fff;} .chip.on.r{background:var(--rd);color:#fff;}
  .descinput{width:100%;background:var(--stone100);border:none;border-radius:16px;padding:12px 16px;font-size:16px;outline:none;margin-bottom:16px;}
  .descinput::placeholder{color:var(--muted);}
  .savebtn{width:100%;color:#fff;font-weight:700;font-size:18px;padding:16px;border-radius:16px;transition:.12s;}
  .savebtn.g{background:var(--em);} .savebtn.r{background:var(--rd);} .savebtn.n{background:#1c1917;}
  .savebtn:active{transform:scale(.98);}
  .savebtn:disabled{opacity:.4;transform:none;}

  /* ajustes */
  .cfglbl{font-size:12px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px;}
  .cfghint{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5;}
  .cfgbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--stone100);color:var(--ink);
    font-family:inherit;font-weight:700;font-size:16px;padding:14px;border-radius:16px;margin-bottom:8px;cursor:pointer;text-align:center;}
  .cfgbtn:active{background:var(--stone200);}
  .hr{height:1px;background:var(--stone200);margin:22px 0;}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="modal"></div>

<script>
"use strict";
// ---------- estado ----------
var STORE = "lancamentos";
var STORE_CFG = "config_entregas";

var lancamentos = load();
var config = loadConfig();

var visao = "dia";
var dataAtual = hojeISO();
var mesAtual = hojeISO().slice(0,7);
var semanaAtual = inicioSemana(hojeISO());   // segunda-feira da semana aberta na aba Semana
var filtroGasto = "Todos";   // categoria escolhida no gráfico de gastos
var barraSel = -1;           // barra tocada no gráfico (-1 = nenhuma)
var graficoAtual = null;     // o que o gráfico na tela mostra, pro toque não precisar re-renderizar

var form = null;            // null | 'entrada' | 'saida'  (folha de lançamento aberta)
var editandoId = null;      // id do lançamento em edição (null = criando um novo)
var formValor = "";
var formDescricao = "";
var formData = null;        // data do lançamento sendo criado/editado
var configAberta = false;

// Chave do que já está montado em #modal. Sem isso, qualquer render() remontaria
// a folha inteira e o teclado do celular fecharia no meio da digitação.
var modalAtual = "";

var ultimoExcluido = null;  // guarda a última exclusão pro "Desfazer"
var toastTimer = null;

var SAIDAS = ["Combustível","Comida","Manutenção","Outros"];
var ENTRADAS = ["iFood","99","Uber","Lalamove","Particular"];

function load(){
  try{
    var v = JSON.parse(localStorage.getItem(STORE) || "[]");
    if(!Array.isArray(v)) return [];
    // Migração dos lançamentos antigos: eles não têm os campos que a sincronização
    // precisa. O id começa com o Date.now() da criação, então dá pra reconstruir
    // o carimbo de tempo sem inventar nada.
    var mexeu = false;
    v.forEach(function(l){
      if(!l.atualizado_em){
        var ms = Number(String(l.id).split("-")[0]);
        l.atualizado_em = new Date(isFinite(ms) && ms > 0 ? ms : Date.now()).toISOString();
        mexeu = true;
      }
      if(typeof l.excluido !== "boolean"){ l.excluido = false; mexeu = true; }
      if(typeof l.sincronizado !== "boolean"){ l.sincronizado = false; mexeu = true; }
    });
    if(mexeu){ try{ localStorage.setItem(STORE, JSON.stringify(v)); }catch(e){} }
    return v;
  }catch(e){ return []; }
}
// Só os lançamentos vivos. Os excluídos continuam no array marcados com
// `excluido: true` — sem isso a exclusão nunca chegaria nos outros aparelhos.
function ativos(){ return lancamentos.filter(function(l){ return !l.excluido; }); }
function carimbar(l){ l.atualizado_em = new Date().toISOString(); l.sincronizado = false; return l; }
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(lancamentos)); return true; }
  catch(e){
    // Cota cheia ou armazenamento bloqueado (aba anônima do Safari). Antes isso falhava
    // em silêncio e os lançamentos sumiam no próximo reload — agora o usuário fica sabendo.
    mostrarToast("O aparelho não deixou salvar. Confira o espaço livre do celular.", "", true);
    return false;
  }
}
function loadConfig(){
  try{ var c = JSON.parse(localStorage.getItem(STORE_CFG) || "{}"); return { metaDiaria: Number(c.metaDiaria) || 0 }; }
  catch(e){ return { metaDiaria: 0 }; }
}
function saveConfig(){ try{ localStorage.setItem(STORE_CFG, JSON.stringify(config)); }catch(e){} }

// ---------- utils ----------
function pad(n){ return String(n).padStart(2,"0"); }
function hojeISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fmt(v){ return (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function semRS(v){ return fmt(v).replace("R$","").trim(); }

// Lê o valor digitado aceitando vírgula OU ponto como separador decimal.
// A regra: o último separador só vale como decimal se sobrarem 1 ou 2 dígitos
// depois dele. Assim "1.234" continua sendo mil duzentos e trinta e quatro,
// e "25.50" vira 25,50 (antes virava R$ 2.550,00 sem ninguém perceber).
function parseValor(s){
  var t = String(s).replace(/[^0-9.,]/g,"");
  if(!t) return 0;
  var sep = Math.max(t.lastIndexOf(","), t.lastIndexOf("."));
  var inteiro = t, decimal = "";
  if(sep > -1){
    var depois = t.slice(sep+1);
    if(depois.length > 0 && depois.length <= 2 && !/[.,]/.test(depois)){
      inteiro = t.slice(0, sep);
      decimal = depois;
    }
  }
  inteiro = inteiro.replace(/[.,]/g,"");
  var n = parseFloat((inteiro || "0") + (decimal ? "."+decimal : ""));
  return isNaN(n) ? 0 : n;
}
function paraCampo(v){ return v.toFixed(2).replace(".", ","); }

function rotuloData(iso){
  if(iso===hojeISO()) return "Hoje";
  var o=new Date(); o.setDate(o.getDate()-1);
  var oi=o.getFullYear()+"-"+pad(o.getMonth()+1)+"-"+pad(o.getDate());
  if(iso===oi) return "Ontem";
  return new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{day:"numeric",month:"long"});
}
function diaSemana(iso){ return new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long"}); }
function semanaCurta(iso){ return new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""); }
function numDia(iso){ return Number(iso.split("-")[2]); }
function cap1(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function rotuloMes(ym){ return cap1(new Date(ym+"-01T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"})); }
function corSaldo(n){ return n>0?"pos":(n<0?"neg":"zero"); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function soma(lista,tipo){ return lista.reduce(function(s,l){ return s + (l.tipo===tipo ? l.valor : 0); },0); }

// ---------- datas de período ----------
function isoDe(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function somaDias(iso, n){ var d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return isoDe(d); }
// Semana de segunda a domingo: é a semana de trabalho, e o domingo fecha a conta.
function inicioSemana(iso){ var d=new Date(iso+"T12:00:00"); return somaDias(iso, -((d.getDay()+6)%7)); }
function diasNoMes(ym){ var p=ym.split("-"); return new Date(Number(p[0]), Number(p[1]), 0).getDate(); }
function diasDoIntervalo(ini, n){ var r=[]; for(var i=0;i<n;i++) r.push(somaDias(ini,i)); return r; }
function nomeMes(iso){ return new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{month:"long"}); }
function mesCurto(iso){ return new Date(iso+"T12:00:00").toLocaleDateString("pt-BR",{month:"short"}).replace(".",""); }
function intervaloSemana(ini){
  var fim = somaDias(ini, 6);
  if(ini.slice(0,7) === fim.slice(0,7)) return numDia(ini)+" a "+numDia(fim)+" de "+nomeMes(fim);
  return numDia(ini)+" de "+nomeMes(ini)+" a "+numDia(fim)+" de "+nomeMes(fim);
}
function rotuloSemana(ini){
  var atual = inicioSemana(hojeISO());
  if(ini === atual) return "Esta semana";
  if(ini === somaDias(atual, -7)) return "Semana passada";
  var fim = somaDias(ini, 6);
  return ini.slice(0,7) === fim.slice(0,7)
    ? numDia(ini)+" a "+numDia(fim)+" "+mesCurto(fim)
    : numDia(ini)+" "+mesCurto(ini)+" a "+numDia(fim)+" "+mesCurto(fim);
}

// ---------- categorias de gasto ----------
// Os gastos têm atalhos fixos, mas a descrição também aceita texto livre. Sem isto,
// quem digitou "gasolina" em vez de tocar em "Combustível" sumiria do gráfico de
// combustível — justamente o número que ele mais quer acompanhar.
// (Sem "posto" na lista de propósito: casaria com "Imposto".)
var SINONIMOS_GASTO = [
  [/combust|gasolina|etanol|[aá]lcool|diesel|abastec/i, "Combustível"],
  [/comida|almo[cç]o|janta|lanche|caf[eé]|marmita|refei[cç]/i, "Comida"],
  [/manuten|mec[aâ]nic|[oó]leo|pneu|pe[cç]a|oficina|revis|freio|corrente/i, "Manutenção"]
];
function categoriaGasto(desc){
  var d = String(desc||"").trim();
  if(SAIDAS.indexOf(d) >= 0) return d;
  for(var i=0;i<SINONIMOS_GASTO.length;i++){ if(SINONIMOS_GASTO[i][0].test(d)) return SINONIMOS_GASTO[i][1]; }
  if(!d || d === "Gasto") return "Outros";
  return d;   // descrição própria que não bate com nada ("Pedágio"): vira categoria dela mesma
}
// Uma barra por dia do período: quanto saiu naquele dia, na categoria escolhida.
function dadosGastos(lista, dias, filtro){
  var porDia = {};
  lista.forEach(function(l){
    if(l.tipo!=="saida") return;
    if(filtro!=="Todos" && categoriaGasto(l.descricao)!==filtro) return;
    porDia[l.data] = (porDia[l.data]||0) + l.valor;
  });
  return dias.map(function(iso){ return { data:iso, valor:porDia[iso]||0 }; });
}
// Topo da escala arredondado pra um número "limpo", com a metade também limpa,
// porque ela vira a linha do meio: 60 -> 60, 65 -> 80, 130 -> 150.
function tetoRedondo(v){
  if(!(v > 0)) return 10;
  var p = Math.pow(10, Math.floor(Math.log(v)/Math.LN10));
  var passos = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for(var i=0;i<passos.length;i++){ if(v <= passos[i]*p + 1e-9) return passos[i]*p; }
  return 10*p;
}
function fmtCurto(v){ return Math.round(v)===v ? "R$ "+v.toLocaleString("pt-BR") : fmt(v); }

function salvar(){
  var v=parseValor(formValor); if(v<=0) return;
  var desc=(formDescricao||"").trim() || (form==="entrada"?"Entrega":"Gasto");
  if(editandoId){
    var alvo=editandoId;
    lancamentos = lancamentos.map(function(l){
      if(l.id!==alvo) return l;
      return carimbar({ id:l.id, tipo:form, valor:v, descricao:desc, data:l.data, hora:l.hora, excluido:false });
    });
  }else{
    var agora=new Date();
    lancamentos.unshift(carimbar({
      id:Date.now()+"-"+Math.random().toString(36).slice(2,7),
      tipo:form, valor:v, descricao:desc,
      data:formData||dataAtual,
      hora:agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
      excluido:false
    }));
  }
  save(); form=null; editandoId=null; render(); sincronizar();
}

function excluir(id){
  var achado=null;
  for(var i=0;i<lancamentos.length;i++){ if(lancamentos[i].id===id){ achado=lancamentos[i]; break; } }
  if(!achado || achado.excluido) return;
  // Exclusão "macia": a linha fica marcada como excluída em vez de sumir do array.
  // Se ela simplesmente sumisse, o próximo sync a traria de volta do servidor.
  achado.excluido = true; carimbar(achado);
  ultimoExcluido = achado.id;
  save(); render(); sincronizar();
  // Sem diálogo de confirmação (chato no celular), mas com volta: 5s pra desfazer.
  mostrarToast("Lançamento excluído.", '<button onclick="desfazer()">Desfazer</button>');
}
function desfazer(){
  if(!ultimoExcluido) return;
  for(var i=0;i<lancamentos.length;i++){
    if(lancamentos[i].id===ultimoExcluido){ lancamentos[i].excluido=false; carimbar(lancamentos[i]); break; }
  }
  ultimoExcluido = null;
  save(); esconderToast(); render(); sincronizar();
}

// A URL e a chave abaixo são públicas de propósito: em app estático elas ficam
// sempre visíveis no código. Quem protege os dados é o RLS — as políticas exigem
// estar autenticado e só liberam as linhas do próprio usuário (ver supabase-schema.sql).
// A SENHA nunca fica aqui: é digitada uma vez por aparelho, em Ajustes.
var SUPABASE_URL = "https://ncchjrwivvlyyngpaizs.supabase.co";
var SUPABASE_KEY = "sb_publishable_Z0s_JAG-2i5XaQSU_RbafQ_vSkBXYGC";

var STORE_SESSAO = "sync_sessao";
var STORE_DESDE  = "sync_desde";
var INICIO_DOS_TEMPOS = "1970-01-01T00:00:00.000Z";

var sessao = carregarSessao();
var syncEstado = "";      // "" | sincronizando | ok | offline | erro
var syncErro = "";
var syncRodando = false;
var syncPedido = false;   // sincronizar de novo assim que a rodada atual acabar

function syncConfigurado(){ return !!(SUPABASE_URL && SUPABASE_KEY); }
function syncLigado(){ return syncConfigurado() && !!(sessao && sessao.access_token); }
function pendentes(){ return lancamentos.filter(function(l){ return !l.sincronizado; }); }

function carregarSessao(){
  try{ var s=JSON.parse(localStorage.getItem(STORE_SESSAO)||"null"); return (s && s.access_token) ? s : null; }
  catch(e){ return null; }
}
function guardarSessao(s){
  sessao = s;
  try{
    if(s) localStorage.setItem(STORE_SESSAO, JSON.stringify(s));
    else if(localStorage.removeItem) localStorage.removeItem(STORE_SESSAO);
  }catch(e){}
}
function desde(){ try{ return localStorage.getItem(STORE_DESDE) || INICIO_DOS_TEMPOS; }catch(e){ return INICIO_DOS_TEMPOS; } }
function guardarDesde(v){ try{ localStorage.setItem(STORE_DESDE, v); }catch(e){} }

// --- autenticação automática, sem ninguém digitar nada ---
// Sign-in anônimo: o Supabase cria uma conta só pra este aparelho no primeiro
// acesso e devolve uma sessão que fica guardada aqui. O usuário nunca vê login.
// (Exige "Allow anonymous sign-ins" ligado em Authentication > Sign In / Providers.)
function garantirSessao(){
  if(sessao && sessao.access_token) return Promise.resolve(sessao);
  return entrarAnonimo();
}
function entrarAnonimo(){
  return fetch(SUPABASE_URL+"/auth/v1/signup", {
    method:"POST",
    headers:{ "apikey":SUPABASE_KEY, "Content-Type":"application/json" },
    body:JSON.stringify({ data:{} })
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok || !j.access_token) throw new Error(j.msg || j.error_description || j.error || ("Erro "+r.status));
      guardarSessao({
        access_token:j.access_token, refresh_token:j.refresh_token,
        user_id:(j.user&&j.user.id)||"", anonimo:true
      });
      // Conta nova: o servidor não tem nada nosso ainda, então TUDO o que já
      // existe neste aparelho precisa subir. É isso que salva o histórico antigo.
      guardarDesde(INICIO_DOS_TEMPOS);
      lancamentos.forEach(function(l){ l.sincronizado = false; });
      save();
      return sessao;
    });
  });
}
// Deixa uma marca de qual aparelho é esta conta anônima, pra dar pra achar os
// dados certos no painel do Supabase depois. Nunca derruba o sync se falhar.
function registrarDispositivo(){
  return api("dispositivos?on_conflict=user_id", {
    method:"POST",
    headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
    body:JSON.stringify({
      user_id: sessao.user_id,
      agente: String((typeof navigator!=="undefined" && navigator.userAgent) || "").slice(0,200),
      visto_em: new Date().toISOString()
    })
  }).catch(function(){});
}
function renovarSessao(){
  if(!sessao || !sessao.refresh_token) return Promise.reject(new Error("sem sessão"));
  return fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token", {
    method:"POST",
    headers:{ "apikey":SUPABASE_KEY, "Content-Type":"application/json" },
    body:JSON.stringify({ refresh_token: sessao.refresh_token })
  }).then(function(r){
    return r.json().then(function(j){
      if(!r.ok || !j.access_token) throw new Error("sessão expirada");
      guardarSessao({
        access_token:j.access_token, refresh_token:j.refresh_token,
        user_id:(j.user&&j.user.id)||sessao.user_id, email:(j.user&&j.user.email)||sessao.email
      });
      return j;
    });
  });
}

// Chamada REST com renovação automática do token: o access_token dura 1h, e
// ninguém vai apertar "entrar de novo" toda hora no celular do meu pai.
function api(caminho, opcoes, jaRenovou){
  var o = opcoes || {};
  var h = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + (sessao ? sessao.access_token : ""),
    "Content-Type": "application/json"
  };
  for(var k in (o.headers||{})) h[k] = o.headers[k];
  return fetch(SUPABASE_URL+"/rest/v1/"+caminho, { method:o.method||"GET", headers:h, body:o.body })
    .then(function(r){
      if(r.status === 401 && !jaRenovou){
        return renovarSessao().then(function(){ return api(caminho, opcoes, true); });
      }
      if(!r.ok) return r.text().then(function(t){ throw new Error("HTTP "+r.status+" "+String(t).slice(0,140)); });
      // Cuidado: com "Prefer: return=minimal" o PostgREST responde 201 (não 204)
      // e SEM corpo. Chamar r.json() direto aqui estourava depois de a gravação
      // já ter dado certo — e a fila nunca era marcada como enviada.
      return r.text().then(function(t){ return t ? JSON.parse(t) : null; });
    });
}

function paraServidor(l){
  return { user_id:sessao.user_id, id:l.id, tipo:l.tipo, valor:l.valor, descricao:l.descricao,
           data:l.data, hora:l.hora, excluido:!!l.excluido, atualizado_em:l.atualizado_em };
}
function doServidor(r){
  return { id:String(r.id), tipo:r.tipo, valor:Number(r.valor), descricao:String(r.descricao||""),
           data:String(r.data).slice(0,10), hora:String(r.hora||"00:00"),
           excluido:!!r.excluido, atualizado_em:r.atualizado_em, sincronizado:true };
}

// Puxa ANTES de empurrar: assim, se o servidor tem uma versão mais nova de um
// lançamento, ela vence aqui e a versão local velha não sobe por cima dela.
function sincronizar(){
  if(!syncConfigurado()) return Promise.resolve();
  // Salvou um lançamento enquanto a sincronização anterior ainda rodava? Não pode
  // ficar esperando o próximo ciclo: anota o pedido e roda de novo ao terminar.
  if(syncRodando){ syncPedido = true; return Promise.resolve(); }
  if(typeof navigator !== "undefined" && navigator.onLine === false){ syncEstado="offline"; return Promise.resolve(); }
  syncRodando = true; syncEstado = "sincronizando"; syncErro = "";
  return garantirSessao()
    .then(puxarNovidades)
    .then(enviarPendentes)
    .then(registrarDispositivo)
    .then(function(){ syncEstado = "ok"; })
    .catch(function(e){
      // Ficar sem sinal na rua é o normal, não é erro: fica pendente e tenta depois.
      var msg = String((e && e.message) || e);
      syncEstado = /failed to fetch|networkerror|network request|load failed/i.test(msg) ? "offline" : "erro";
      syncErro = msg;
    })
    .then(function(){
      syncRodando = false;
      if(syncPedido){ syncPedido = false; return sincronizar(); }
    });
}

function enviarPendentes(){
  var pend = pendentes();
  if(!pend.length) return Promise.resolve();
  var lote = pend.slice(0, 200);
  var corpo = lote.map(paraServidor);
  return api("lancamentos?on_conflict=user_id,id", {
    method:"POST",
    headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
    body:JSON.stringify(corpo)
  }).then(function(){
    var enviados = {};
    lote.forEach(function(l){ enviados[l.id] = l.atualizado_em; });
    lancamentos.forEach(function(l){
      // Só marca como sincronizado se não mudou de novo enquanto subia.
      if(enviados[l.id] && enviados[l.id] === l.atualizado_em) l.sincronizado = true;
    });
    save();
    if(pendentes().length) return enviarPendentes();   // ainda tem fila
  });
}

function puxarNovidades(){
  var marca = desde();
  return api("lancamentos?select=*&atualizado_em=gt."+encodeURIComponent(marca)+"&order=atualizado_em.asc&limit=1000")
    .then(function(linhas){
      if(!linhas || !linhas.length) return;
      var porId = {};
      lancamentos.forEach(function(l,i){ porId[l.id] = i; });
      var maior = marca, mudou = false;
      linhas.forEach(function(r){
        var vindo = doServidor(r);
        if(vindo.atualizado_em > maior) maior = vindo.atualizado_em;
        var i = porId[vindo.id];
        if(i === undefined){ porId[vindo.id] = lancamentos.push(vindo) - 1; mudou = true; return; }
        // Último a escrever ganha; empate mantém o que já está no aparelho.
        if(vindo.atualizado_em > lancamentos[i].atualizado_em){ lancamentos[i] = vindo; mudou = true; }
      });
      guardarDesde(maior);
      if(mudou){ save(); render(); }
      if(linhas.length === 1000) return puxarNovidades();   // tinha mais que uma página
    });
}

// Quanto veio de cada origem / foi pra cada categoria, com barra proporcional.
// Os gastos agrupam pela categoria (junta "gasolina" com "Combustível"), pra que
// "Onde foi" e o gráfico de gastos contem sempre a mesma coisa.
function agrupar(lista, tipo){
  var m = {};
  lista.forEach(function(l){
    if(l.tipo!==tipo) return;
    var k = tipo==="saida" ? categoriaGasto(l.descricao) : l.descricao;
    m[k] = (m[k]||0) + l.valor;
  });
  return Object.keys(m)
    .map(function(k){ return { nome:k, total:m[k] }; })
    .sort(function(a,b){ return b.total - a.total; });
}
function htmlResumo(titulo, itens, total, cor){
  if(!itens.length) return "";
  var linhas = itens.map(function(i){
    var p = total>0 ? Math.round(i.total/total*100) : 0;
    return '<div>'+
      '<div class="bhead"><span class="bname">'+esc(i.nome)+'</span>'+
      '<span class="bval tnum">'+fmt(i.total)+' · '+p+'%</span></div>'+
      '<div class="bar"><i'+(cor?' class="'+cor+'"':'')+' style="width:'+p+'%"></i></div>'+
    '</div>';
  }).join("");
  return '<div class="card"><p class="lbl">'+titulo+'</p><div class="brk">'+linhas+'</div></div>';
}

// ---------- blocos das abas Semana e Mês ----------
function resumoPorDia(lista){
  var mapa={};
  lista.forEach(function(l){ if(!mapa[l.data]) mapa[l.data]={entrada:0,saida:0}; mapa[l.data][l.tipo]+=l.valor; });
  return Object.keys(mapa).map(function(k){
    return {data:k,entrada:mapa[k].entrada,saida:mapa[k].saida,saldo:mapa[k].entrada-mapa[k].saida};
  }).sort(function(a,b){return b.data.localeCompare(a.data);});
}
// Dia trabalhado = dia com ganho. Um domingo de folga em que ele só abasteceu
// não conta, senão derrubaria a média.
function diasTrabalhados(lista){
  var d = {};
  lista.forEach(function(l){ if(l.tipo==="entrada") d[l.data] = true; });
  return Object.keys(d).length;
}
function htmlMediaDias(trabalhados, saldo){
  return trabalhados>0
    ? '<p class="media">'+trabalhados+(trabalhados===1?" dia trabalhado":" dias trabalhados")+
      ' · média de '+fmt(saldo/trabalhados)+' de saldo por dia</p>'
    : '';
}
function htmlListaDias(dias, vazio){
  if(!dias.length) return '<div class="empty"><p class="a">'+vazio+'</p></div>';
  return '<ul class="list">'+dias.map(function(d){
    return '<li><button class="dayrow" onclick="irParaDia(\''+d.data+'\')">'+
      '<span class="daybox"><span class="n tnum">'+numDia(d.data)+'</span><span class="w">'+semanaCurta(d.data)+'</span></span>'+
      '<span class="flow"><span class="fin g tnum">+ '+semRS(d.entrada)+'</span><span class="fin r tnum">− '+semRS(d.saida)+'</span></span>'+
      '<span class="right"><span class="s tnum '+corSaldo(d.saldo)+'">'+fmt(d.saldo)+'</span><span class="t">saldo</span></span>'+
    '</button></li>';
  }).join("")+'</ul>';
}

// ---------- gráfico de gastos ----------
// Uma série só (quanto saiu por dia), então uma cor só e nenhuma legenda: o título
// do card já diz o que está desenhado. Vermelho porque no app inteiro vermelho é saída.
var COR_BARRA = "#dc2626", COR_APAGADA = "#d6d3d1", COR_GRADE = "#e7e5e4";
var COR_TEXTO = "#78716c", COR_TEXTO_FRACO = "#a8a29e", COR_TINTA = "#1c1917";

// Card de gastos: total do período, atalhos por categoria e uma barra por dia.
function htmlGastos(lista, dias, periodo){
  var semana = periodo==="semana";
  var cats = agrupar(lista, "saida");
  if(!cats.length){
    return '<div class="card"><p class="lbl">Gastos '+(semana?"da semana":"do mês")+'</p>'+
      '<p class="gvazio">Nenhum gasto '+(semana?"nessa semana":"nesse mês")+'.</p></div>';
  }
  // A categoria escolhida pode não existir neste período (nada de Manutenção nesta
  // semana, por exemplo). Aí mostra Todos, mas guarda a escolha pra quando voltar.
  var filtro = filtroGasto;
  if(filtro!=="Todos" && !cats.some(function(c){ return c.nome===filtro; })) filtro = "Todos";

  var dados = dadosGastos(lista, dias, filtro);
  var total = dados.reduce(function(s,d){ return s+d.valor; }, 0);
  var titulo = filtro==="Todos" ? ("Gastos "+(semana?"da semana":"do mês"))
                                : (esc(filtro)+(semana?" na semana":" no mês"));
  var chips = cats.length < 2 ? "" :
    '<div class="gchips">'+["Todos"].concat(cats.map(function(c){ return c.nome; })).map(function(c){
      return '<button class="gchip'+(c===filtro?" on":"")+'" data-cat="'+esc(c)+'" '+
             'onclick="escolherFiltro(this.getAttribute(\'data-cat\'))">'+esc(c)+'</button>';
    }).join("")+'</div>';

  graficoAtual = { dados:dados, total:total, trabalhados:diasTrabalhados(lista), semana:semana };
  return '<div class="card"><p class="lbl">'+titulo+'</p>'+chips+
    '<p class="gtotal">'+fmt(total)+'</p>'+
    '<p class="gleitura" id="gleitura" aria-live="polite">'+leituraGrafico(graficoAtual)+'</p>'+
    htmlGrafico(graficoAtual)+
  '</div>';
}

function larguraGrafico(){
  var app = document.getElementById("app");
  var w = app && app.clientWidth ? app.clientWidth : 0;
  // #app tem 16px de respiro de cada lado e o card mais 24px: sobra o miolo do card.
  return w > 0 ? Math.max(220, w - 80) : 320;
}

// Colunas finas (no máximo 24px), topo arredondado e base reta, sempre 2px de folga
// entre elas, e grade em fio. O SVG é desenhado na largura exata do card, pra texto
// e traço saírem nítidos em vez de esticados.
function htmlGrafico(g){
  var W = larguraGrafico();
  var ESQ = 44, TOPO = 20, ALT = 120, EIXO = 22;   // margem dos valores, folga do rótulo, altura das barras, faixa do eixo
  var H = TOPO + ALT + EIXO, base = TOPO + ALT;
  var n = g.dados.length, slot = (W - ESQ) / n;
  var larg = Math.max(2, Math.min(24, slot - 2));
  var maxV = 0, iMax = -1;
  g.dados.forEach(function(d,i){ if(d.valor > maxV){ maxV = d.valor; iMax = i; } });
  var teto = tetoRedondo(maxV);
  var hoje = hojeISO();
  var r1 = function(v){ return Math.round(v*10)/10; };
  g.W = W; g.esq = ESQ; g.slot = slot;
  if(barraSel >= n) barraSel = -1;

  var s = '<svg id="grafico" class="grafico" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" '+
    'role="img" tabindex="0" aria-label="Gastos por dia, '+esc(fmt(g.total))+' no total. A lista de dias abaixo tem os valores." '+
    'onpointerdown="tocarGrafico(event)" onkeydown="teclaGrafico(event)">';

  // grade: topo e meio da escala, com o valor na margem da esquerda
  [teto, teto/2].forEach(function(v){
    var gy = r1(base - ALT*v/teto);
    s += '<line x1="'+ESQ+'" x2="'+W+'" y1="'+gy+'" y2="'+gy+'" stroke="'+COR_GRADE+'" stroke-width="1"/>'+
         '<text x="'+(ESQ-8)+'" y="'+(gy+4)+'" text-anchor="end" font-size="10" fill="'+COR_TEXTO+'">'+esc(fmtCurto(v))+'</text>';
  });
  s += '<line x1="'+ESQ+'" x2="'+W+'" y1="'+base+'" y2="'+base+'" stroke="'+COR_GRADE+'" stroke-width="1"/>';

  g.dados.forEach(function(d,i){
    var cx = ESQ + slot*i + slot/2;
    if(d.valor > 0){
      var h = Math.max(2, ALT*d.valor/teto);
      var x = cx - larg/2, topo = base - h, rr = r1(Math.min(4, larg/2, h));
      var cor = (barraSel < 0 || barraSel === i) ? COR_BARRA : COR_APAGADA;
      s += '<path class="gbar" data-i="'+i+'" fill="'+cor+'" d="M'+r1(x)+','+base+
        'V'+r1(topo+rr)+'A'+rr+','+rr+' 0 0 1 '+r1(x+rr)+','+r1(topo)+
        'H'+r1(x+larg-rr)+'A'+rr+','+rr+' 0 0 1 '+r1(x+larg)+','+r1(topo+rr)+
        'V'+base+'Z"/>';
    }
    // eixo: na semana, todos os dias; no mês, 1, 8, 15, 22 e 29
    var num = numDia(d.data);
    if(g.semana || num % 7 === 1){
      var ehHoje = d.data === hoje, futuro = d.data > hoje;
      s += '<text x="'+r1(cx)+'" y="'+(base+16)+'" text-anchor="middle" font-size="11"'+
        (ehHoje ? ' font-weight="700"' : '')+
        ' fill="'+(ehHoje ? COR_TINTA : (futuro ? COR_TEXTO_FRACO : COR_TEXTO))+'">'+
        (g.semana ? semanaCurta(d.data) : num)+'</text>';
    }
  });

  // O valor vai escrito só na barra mais alta. Os outros aparecem ao tocar e na lista
  // de dias embaixo: número em cima de toda barra vira poluição e ninguém lê.
  if(iMax >= 0){
    var rot = fmtCurto(maxV), meia = rot.length*3.3;
    var lx = Math.min(W - meia, Math.max(ESQ + meia, ESQ + slot*iMax + slot/2));
    var ly = base - Math.max(2, ALT*maxV/teto) - 6;
    s += '<text x="'+r1(lx)+'" y="'+r1(ly)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+COR_TINTA+'" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">'+esc(rot)+'</text>';
  }
  return s + '</svg>';
}

function leituraGrafico(g){
  if(barraSel >= 0 && g.dados[barraSel]){
    var d = g.dados[barraSel];
    return '<b>'+fmt(d.valor)+'</b> · '+semanaCurta(d.data)+', '+numDia(d.data)+' de '+mesCurto(d.data);
  }
  // Divide pelos dias TRABALHADOS, igual à média do card de saldo, pra que os dois
  // "por dia" da mesma tela queiram dizer a mesma coisa.
  if(g.trabalhados > 0) return 'Média de <b>'+fmt(g.total/g.trabalhados)+'</b> por dia trabalhado';
  return 'Toque numa barra pra ver o dia';
}
function ultimoIndiceValido(g){
  var hoje = hojeISO(), u = -1;
  g.dados.forEach(function(d,i){ if(d.data <= hoje) u = i; });
  return u;
}
// O gráfico inteiro é a área de toque e acha a coluna mais perto do dedo. No mês as
// colunas têm uns 9px: pequenas demais pra acertar uma por uma.
function tocarGrafico(ev){
  var g = graficoAtual; if(!g || !g.slot) return;
  var caixa = ev.currentTarget.getBoundingClientRect();
  var x = (ev.clientX - caixa.left) * (g.W / caixa.width) - g.esq;
  if(x < 0) return;                                  // tocou na margem dos valores
  var i = Math.min(g.dados.length-1, Math.floor(x / g.slot));
  if(i > ultimoIndiceValido(g)) return;              // dia que ainda não chegou
  selecionarBarra(i === barraSel ? -1 : i);          // tocar de novo na mesma solta
}
function teclaGrafico(ev){
  var g = graficoAtual; if(!g) return;
  var u = ultimoIndiceValido(g); if(u < 0) return;
  if(ev.key === "ArrowRight"){ selecionarBarra(barraSel < 0 ? 0 : Math.min(u, barraSel+1)); ev.preventDefault(); }
  else if(ev.key === "ArrowLeft"){ selecionarBarra(barraSel < 0 ? u : Math.max(0, barraSel-1)); ev.preventDefault(); }
  else if(ev.key === "Escape"){ selecionarBarra(-1); }
}
// Destaca a barra escolhida e apaga as outras mexendo só nas cores. Re-renderizar a
// tela a cada toque jogaria o SVG fora no meio do gesto.
function selecionarBarra(i){
  barraSel = i;
  var g = graficoAtual; if(!g) return;
  var barras = document.querySelectorAll("#grafico .gbar");
  for(var k=0;k<barras.length;k++){
    var idx = Number(barras[k].getAttribute("data-i"));
    barras[k].setAttribute("fill", (barraSel < 0 || idx === barraSel) ? COR_BARRA : COR_APAGADA);
  }
  var el = document.getElementById("gleitura");
  if(el) el.innerHTML = leituraGrafico(g);
}

// ---------- render ----------
function render(irAoTopo){
  var app = document.getElementById("app");
  var y = app.scrollTop;   // preserva a posição da lista: excluir/salvar não joga pro topo
  var html="";

  html+='<div class="toggle-row"><span class="spacer"></span><div class="toggle">'+
    '<button class="'+(visao==="dia"?"on":"")+'" onclick="setVisao(\'dia\')">Dia</button>'+
    '<button class="'+(visao==="semana"?"on":"")+'" onclick="setVisao(\'semana\')">Semana</button>'+
    '<button class="'+(visao==="mes"?"on":"")+'" onclick="setVisao(\'mes\')">Mês</button>'+
    '</div><button class="gear" onclick="abrirConfig()" aria-label="Ajustes">'+GEAR+'</button></div>';

  graficoAtual = null;   // só Semana e Mês têm gráfico; htmlGastos() preenche de novo

  if(visao==="dia"){
    var doDia=ativos().filter(function(l){return l.data===dataAtual;})
      .sort(function(a,b){return b.id.localeCompare(a.id);});
    var ent=soma(doDia,"entrada"), sai=soma(doDia,"saida");
    var ehHoje=dataAtual===hojeISO();

    html+='<div class="nav">'+
      '<button class="arrow" onclick="mudarDia(-1)" aria-label="Dia anterior">'+ARROW_L+'</button>'+
      '<div><p class="title">'+rotuloData(dataAtual)+'</p><p class="sub cap">'+diaSemana(dataAtual)+'</p></div>'+
      '<button class="arrow" onclick="mudarDia(1)" '+(ehHoje?"disabled":"")+' aria-label="Próximo dia">'+ARROW_R+'</button>'+
    '</div>';

    var meta="";
    if(config.metaDiaria>0){
      // A meta é sobre o LÍQUIDO (entrou menos saiu), não sobre o bruto. A pergunta
      // que ela responde é "já posso parar hoje?" — e se ele gastou R$ 80 de gasolina
      // hoje, precisa mesmo faturar R$ 80 a mais pra levar pra casa o mesmo tanto.
      var liquido = ent - sai;
      var pct = Math.max(0, Math.min(100, Math.round(liquido/config.metaDiaria*100)));
      var falta = config.metaDiaria - liquido;
      meta='<div class="meta">'+
        '<div class="metatop"><span>Meta do dia (o que sobra)</span><span class="tnum">'+fmt(config.metaDiaria)+'</span></div>'+
        '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
        '<p class="metasub'+(falta>0?"":" ok")+'">'+
          (falta>0 ? ("Faltam "+fmt(falta)+" · "+pct+"% da meta")
                   : ("Meta batida! "+fmt(-falta)+" acima."))+
        '</p></div>';
    }
    html+=htmlCardSaldo(ehHoje?"Saldo de hoje":"Saldo do dia", ent, sai, meta);

    if(doDia.length===0){
      html+='<div class="empty"><p class="a">Nenhum lançamento'+(ehHoje?" hoje":" nesse dia")+' ainda.</p>'+
        '<p class="b">Toque em <b>Entrada</b> ou <b>Saída</b> pra começar.</p></div>';
    }else{
      html+='<ul class="list">';
      doDia.forEach(function(l){
        var g=l.tipo==="entrada";
        html+='<li class="item">'+
          '<button class="itemmain" onclick="abrirEdicao(\''+l.id+'\')" aria-label="Editar lançamento">'+
            '<span class="dot '+(g?"g":"r")+'">'+(g?UP:DOWN)+'</span>'+
            '<span class="mid"><span class="desc">'+esc(l.descricao)+'</span><span class="hora">'+esc(l.hora)+'</span></span>'+
            '<span class="amt tnum '+(g?"g":"r")+'">'+(g?"+":"−")+semRS(l.valor)+'</span>'+
          '</button>'+
          '<button class="del" onclick="excluir(\''+l.id+'\')" aria-label="Excluir">'+TRASH+'</button>'+
        '</li>';
      });
      html+='</ul>';
    }
  } else if(visao==="semana"){
    var fimSem = somaDias(semanaAtual, 6);
    var daSemana = ativos().filter(function(l){ return l.data >= semanaAtual && l.data <= fimSem; });
    var entS=soma(daSemana,"entrada"), saiS=soma(daSemana,"saida");
    var semanaDeHoje = inicioSemana(hojeISO());
    var ehSemanaAtual = semanaAtual === semanaDeHoje;
    var recente = ehSemanaAtual || semanaAtual === somaDias(semanaDeHoje, -7);

    html+='<div class="nav">'+
      '<button class="arrow" onclick="mudarSemana(-1)" aria-label="Semana anterior">'+ARROW_L+'</button>'+
      '<div><p class="title">'+rotuloSemana(semanaAtual)+'</p>'+
        '<p class="sub">'+(recente ? intervaloSemana(semanaAtual) : semanaAtual.slice(0,4))+'</p></div>'+
      '<button class="arrow" onclick="mudarSemana(1)" '+(ehSemanaAtual?"disabled":"")+' aria-label="Próxima semana">'+ARROW_R+'</button>'+
    '</div>';

    html+=htmlCardSaldo("Saldo da semana", entS, saiS, htmlMediaDias(diasTrabalhados(daSemana), entS-saiS));
    html+=htmlGastos(daSemana, diasDoIntervalo(semanaAtual, 7), "semana");
    html+=htmlResumo("De onde veio", agrupar(daSemana,"entrada"), entS);
    html+=htmlResumo("Onde foi", agrupar(daSemana,"saida"), saiS, "r");
    html+=htmlListaDias(resumoPorDia(daSemana), "Nenhum lançamento nessa semana.");
  } else {
    var doMes=ativos().filter(function(l){return l.data.indexOf(mesAtual)===0;});
    var entM=soma(doMes,"entrada"), saiM=soma(doMes,"saida");
    var ehMesAtual=mesAtual===hojeISO().slice(0,7);

    html+='<div class="nav">'+
      '<button class="arrow" onclick="mudarMes(-1)" aria-label="Mês anterior">'+ARROW_L+'</button>'+
      '<p class="title">'+rotuloMes(mesAtual)+'</p>'+
      '<button class="arrow" onclick="mudarMes(1)" '+(ehMesAtual?"disabled":"")+' aria-label="Próximo mês">'+ARROW_R+'</button>'+
    '</div>';

    html+=htmlCardSaldo("Saldo do mês", entM, saiM, htmlMediaDias(diasTrabalhados(doMes), entM-saiM));
    html+=htmlGastos(doMes, diasDoIntervalo(mesAtual+"-01", diasNoMes(mesAtual)), "mes");
    html+=htmlResumo("De onde veio", agrupar(doMes,"entrada"), entM);
    html+=htmlResumo("Onde foi", agrupar(doMes,"saida"), saiM, "r");
    html+=htmlListaDias(resumoPorDia(doMes), "Nenhum lançamento nesse mês.");
  }

  if(visao==="dia" && !form && !configAberta){
    html+='<div class="actions"><div class="in">'+
      '<button class="act g" onclick="abrirForm(\'entrada\')">'+PLUS+'Entrada</button>'+
      '<button class="act r" onclick="abrirForm(\'saida\')">'+MINUS+'Saída</button>'+
    '</div></div>';
  }

  app.innerHTML=html;
  app.scrollTop = irAoTopo ? 0 : y;
  renderModal();
}

function renderModal(){
  var m=document.getElementById("modal");
  var chave = form ? ("l:"+form+":"+(editandoId||"novo")) : (configAberta ? "cfg" : "");
  if(chave === modalAtual) return;   // já montado: não remonta (senão o teclado fecha)
  modalAtual = chave;
  if(!chave){ m.innerHTML=""; return; }
  m.innerHTML = (chave==="cfg") ? htmlConfig() : htmlLancamento();
}

function htmlLancamento(){
  var g=form==="entrada";
  var chips=(g?ENTRADAS:SAIDAS).map(function(c){
    var on=formDescricao===c;
    return '<button class="chip '+(on?("on "+(g?"g":"r")):"")+'" data-val="'+esc(c)+'" '+
           'onclick="setDescricao(this.getAttribute(\'data-val\'))">'+esc(c)+'</button>';
  }).join("");
  var v=parseValor(formValor);
  var titulo = editandoId ? (g?"Editar entrada":"Editar gasto") : (g?"Nova entrada":"Novo gasto");
  var acao   = editandoId ? "Salvar alterações" : ("Salvar "+(g?"entrada":"gasto"));
  var quando = formData || dataAtual;
  return '<div class="overlay" onclick="fecharForm()">'+
    '<div class="sheet" onclick="event.stopPropagation()">'+
      '<div class="sheet-head"><h2>'+titulo+'</h2>'+
        '<button class="xbtn" onclick="fecharForm()" aria-label="Fechar">'+X+'</button></div>'+
      '<p class="sheet-date">'+rotuloData(quando)+' · '+diaSemana(quando)+'</p>'+
      '<div class="valbox '+(g?"g":"r")+'"><span class="rs">R$</span>'+
        '<input id="inpValor" type="text" inputmode="decimal" placeholder="0,00" value="'+esc(formValor)+'" '+
        'oninput="onValor(this)" onkeydown="if(event.key===\'Enter\')salvar()"></div>'+
      '<p class="valhint" id="valHint">'+(v>0?("= "+fmt(v)):"")+'</p>'+
      '<div class="chips">'+chips+'</div>'+
      '<input id="inpDesc" class="descinput" type="text" placeholder="'+(g?"Descrição (opcional)":"O que foi? (opcional)")+'" '+
        'value="'+esc(formDescricao)+'" oninput="onDesc(this)" onkeydown="if(event.key===\'Enter\')salvar()">'+
      '<button id="btnSalvar" class="savebtn '+(g?"g":"r")+'" onclick="salvar()" '+(v<=0?"disabled":"")+'>'+acao+'</button>'+
    '</div></div>';
}

function htmlConfig(){
  var m=config.metaDiaria;
  return '<div class="overlay" onclick="fecharConfig()">'+
    '<div class="sheet" onclick="event.stopPropagation()">'+
      '<div class="sheet-head"><h2>Ajustes</h2>'+
        '<button class="xbtn" onclick="fecharConfig()" aria-label="Fechar">'+X+'</button></div>'+
      '<p class="cfglbl">Meta de ganho diário</p>'+
      '<p class="cfghint">Quanto você quer que SOBRE por dia, já descontando os gastos. Deixe vazio pra não mostrar a meta.</p>'+
      '<div class="valbox n"><span class="rs">R$</span>'+
        '<input id="inpMeta" type="text" inputmode="decimal" placeholder="0,00" value="'+(m>0?esc(paraCampo(m)):"")+'" '+
        'oninput="onMeta(this)" onkeydown="if(event.key===\'Enter\')salvarMeta()"></div>'+
      '<p class="valhint" id="metaHint">'+(m>0?("= "+fmt(m)):"")+'</p>'+
      '<button class="savebtn n" onclick="salvarMeta()">Salvar meta</button>'+

    '</div></div>';
}

render();

// ---------- virada da meia-noite ----------
// O app é usado de madrugada. `dataAtual` era definido uma única vez, no load:
// quem deixasse o app aberto às 23h continuaria lançando no dia anterior depois
// da meia-noite, sem perceber. Agora o dia é reconferido quando a tela volta.
var hojeConhecido = hojeISO();
function checarVirada(){
  var agora = hojeISO();
  if(agora === hojeConhecido) return;
  var estavaNoHoje = (dataAtual === hojeConhecido);
  var estavaNoMes  = (mesAtual === hojeConhecido.slice(0,7));
  var estavaNaSemana = (semanaAtual === inicioSemana(hojeConhecido));
  hojeConhecido = agora;
  // Só arrasta quem estava olhando "hoje". Quem foi ver um dia antigo fica lá.
  if(estavaNoHoje) dataAtual = agora;
  if(estavaNoMes)  mesAtual = agora.slice(0,7);
  if(estavaNaSemana) semanaAtual = inicioSemana(agora);
  render();
}

// ---------- gatilhos de sincronização ----------
// Nada disso pede permissão nem mostra tela: roda sozinho, em segundo plano.
function aoVoltarPraTela(){ checarVirada(); sincronizar(); }
if(typeof document.addEventListener === "function"){
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) aoVoltarPraTela(); });
}
window.addEventListener("focus", aoVoltarPraTela);
window.addEventListener("online", function(){ sincronizar(); });
// Girar a tela ou mudar o tamanho da janela muda a largura do gráfico.
var timerResize = null;
window.addEventListener("resize", function(){
  clearTimeout(timerResize);
  timerResize = setTimeout(function(){ if(visao !== "dia") render(); }, 150);
});
if(typeof setInterval === "function"){
  setInterval(checarVirada, 60000);        // caso o app fique aberto na virada
  setInterval(sincronizar, 5 * 60000);     // rede de segurança pro que ficou na fila
}
sincronizar();

// Pede ao navegador pra não descartar os dados quando o espaço apertar.
// Em PWA instalado costuma ser concedido em silêncio — ninguém vê nada.
if(typeof navigator !== "undefined" && navigator.storage && navigator.storage.persist){
  try{
    navigator.storage.persisted()
      .then(function(ja){ if(!ja) return navigator.storage.persist(); })
      .catch(function(){});
  }catch(e){}
}

// service worker
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
